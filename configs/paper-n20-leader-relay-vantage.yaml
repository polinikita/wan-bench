name: paper-n20-leader-relay-vantage
output: results/paper-n20-leader-relay-vantage
committee_sizes: [20]
rates: [100, 1000, 10000, 20000, 100000, 200000]
warmup_s: 30
window_s: 120
drop_tolerance_pct: 20
stop_on_drop: true
# Three repetitions supersede intra-repetition retries: a flaky point is
# outvoted by the cross-repetition median instead of rerun on the same fleet.
point_attempts: 1
# This is a capacity study, not a pass/fail regression. Keeping the threshold
# below the first offered rate makes every measured point exploratory: replica
# skew and Byzantine commitment are recorded without censoring the curve.
strict_through_rate: 99
min_offered_throughput_pct: 25

base:
  region: eu-west-1
  profile: null
  az: eu-west-1a
  # One validator per 8-vCPU, 16-GiB instance; protocol traffic uses private IPs.
  instance_type: c5d.2xlarge
  key_name: wanbench-key
  ssh_key_path: ~/.ssh/id_ed25519_nikita_iota6
  ssh_user: ubuntu
  ssh_open_cidr: null
  spot: false
  disk_gb: 50
  use_instance_store: true
  keep_monitoring_on_down: false
  grafana_open_cidr: null
  deadman_minutes: 60

  # Vantage commit fb4a007035835dbff2bdf593269ef375affec6f2. (This pin was
  # migrated from a 13b4c20 tag to an immutable digest; the digest below is
  # 175c0ba, not 13b4c20, which is sha256:e4bc05f0.)
  image: ghcr.io/polinikita/vantage-node@sha256:d8e573c99df492cbddb7280b2e0e6c5aefa115ba2523b1db906815261fac2289
  image_source: registry

  tx_size: 512
  tx_mode: random
  delta_ms: 200
  max_header_delay_ms: 100
  spam_initial_delay_ms: 10000
  spam_delay_per_node_ms: 200
  spam_lead_ms: 25000
  prometheus_scrape_interval_s: 5

  # f=6 Byzantine authors receive the same load share as every other author;
  # their marker-2 transactions traverse the complete data path but are
  # reported separately from honest goodput and latency. Every Byzantine lane
  # keeps one local copy and sends every batch only to a fixed 5=(f-1)-wide
  # correct-holder group. Its f=6 direct holders are exactly one below the
  # f+1=7 PoA threshold, and the other Byzantine validators receive no copy.
  # The fixed groups are staggered across lanes so that together they burden
  # all 14 correct consensus leaders while each holder retains a complete lane
  # prefix. Byzantine authors form one batch per Delta and refuse repair.
  data_lane_drop_staggered_senders: 6
  data_lane_drop_staggered_width: 19
  data_lane_drop_publisher_stride: 1
  data_lane_drop_staggered_stride: 1
  data_lane_drop_silent_repair: true
  data_lane_drop_headers: false
  leader_relay_attack: true

  wan:
    mode: netem
    rtt_csv: latency/aws-10region-rtt.csv
    jitter_ms: 0.0
    halve_rtt: true
    netem_limit_pkts: 100000

  fault:
    kind: none

# The relay attack leaks state across variants on a reused fleet, so each
# protocol runs its own campaign, matching the recorded reference trio.
variants:
  - name: vantage
    protocol: vantage
    metrics_port: 6003
    echo_avail_claims: true
    vantage_compact_ids: true
