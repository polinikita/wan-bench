name: paper-n100-throughput
output: results/paper-n100-throughput
committee_sizes: [100]
rates: [100, 10000, 150000, 200000, 225000, 250000, 275000, 300000]
warmup_s: 30
window_s: 120
drop_tolerance_pct: 5
stop_on_drop: true
strict_through_rate: 10000
min_offered_throughput_pct: 95

base:
  region: eu-west-1
  profile: null
  az: eu-west-1a
  # 8 vCPUs, 16 GiB memory, and one 200 GB local NVMe SSD.
  instance_type: c5d.2xlarge
  key_name: wanbench-key
  ssh_key_path: ~/.ssh/id_ed25519_nikita_iota6
  ssh_user: ubuntu
  ssh_open_cidr: null
  spot: false
  disk_gb: 50
  use_instance_store: true
  keep_monitoring_on_down: false
  grafana_open_cidr: null
  deadman_minutes: 60

  tx_size: 512
  tx_mode: random
  delta_ms: 200
  max_header_delay_ms: 100
  spam_initial_delay_ms: 10000
  spam_delay_per_node_ms: 200
  spam_lead_ms: 25000
  prometheus_scrape_interval_s: 5

  wan:
    mode: netem
    rtt_csv: latency/aws-10region-rtt.csv
    jitter_ms: 0.0
    halve_rtt: true
    netem_limit_pkts: 100000

  fault:
    kind: none

variants:
  - name: vantage
    protocol: vantage
    # Vantage commit 175c0ba5f6ec203dad2cae877e860f3eb7a2ffc7.
    image: &vantage_image ghcr.io/polinikita/vantage-node@sha256:a8497560d6e199eb1012231371fb3171393d23f9dbee11e9b98f6b119a58bd95
    metrics_port: 6003
    echo_avail_claims: true
    vantage_compact_ids: true

  - name: autobahn-optimistic-a2a
    protocol: autobahn-optimistic
    image: *vantage_image
    metrics_port: 6003
    all_to_all: true

  - name: autobahn-seamless
    protocol: autobahn-seamless
    image: *vantage_image
    metrics_port: 6003

  - name: simpleit-optrbc
    protocol: simple-it
    image: *vantage_image
    metrics_port: 6003

  - name: simpleit-bracha
    protocol: simple-it-bracha
    image: *vantage_image
    metrics_port: 6003

  - name: bluestreak
    protocol: starfish
    image: &starfish_image ghcr.io/iotaledger/starfish@sha256:2cd487533ac9610bb9f260ae888c02a0d5dc0499279f92bb269e1b10f82b46a7
    metrics_port: 1500
    protocol_flags: [--consensus, bluestreak]

  - name: sailfish-pp
    protocol: starfish
    image: *starfish_image
    metrics_port: 1500
    protocol_flags: [--consensus, sailfish-pp]
