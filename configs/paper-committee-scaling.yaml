name: paper-committee-scaling
output: results/paper-committee-scaling
# The n=100 cell is not measured here: on uniform c5d.2xlarge it is identical
# to the throughput ladder's rate-100 point, which every repetition already
# measures. Figures join scaling n<=50 with throughput's rate-100 as n=100.
committee_sizes: [10, 20, 50]
rates: [100]
warmup_s: 30
window_s: 120
drop_tolerance_pct: 5
stop_on_drop: true
# Three repetitions supersede intra-repetition retries: a flaky point is
# outvoted by the cross-repetition median instead of rerun on the same fleet.
point_attempts: 1
min_offered_throughput_pct: 95

base:
  region: eu-west-1
  profile: null
  az: eu-west-1a
  instance_type: c5d.2xlarge
  key_name: wanbench-key
  ssh_key_path: ~/.ssh/id_ed25519_nikita_iota6
  ssh_user: ubuntu
  ssh_open_cidr: null
  spot: false
  disk_gb: 50
  use_instance_store: true
  keep_monitoring_on_down: false
  grafana_open_cidr: null
  deadman_minutes: 60

  tx_size: 512
  tx_mode: random
  delta_ms: 200
  max_header_delay_ms: 100
  spam_initial_delay_ms: 10000
  spam_delay_per_node_ms: 200
  spam_lead_ms: 25000
  prometheus_scrape_interval_s: 5

  wan:
    mode: netem
    rtt_csv: latency/aws-10region-rtt.csv
    jitter_ms: 0.0
    halve_rtt: true
    netem_limit_pkts: 100000

  fault:
    kind: none

variants:
  - name: vantage
    protocol: vantage
    # Vantage commit fb4a007035835dbff2bdf593269ef375affec6f2. The five
    # variants below share one Rust binary, so they must share this one
    # digest: pinning them apart turns a protocol comparison into a build
    # comparison. Re-pin here only.
    image: &vantage_image ghcr.io/polinikita/vantage-node@sha256:d8e573c99df492cbddb7280b2e0e6c5aefa115ba2523b1db906815261fac2289
    metrics_port: 6003
    echo_avail_claims: true
    vantage_compact_ids: true

  - name: autobahn-optimistic-a2a
    protocol: autobahn-optimistic
    image: *vantage_image
    metrics_port: 6003
    all_to_all: true

  - name: autobahn-seamless
    protocol: autobahn-seamless
    image: *vantage_image
    metrics_port: 6003

  - name: simpleit-optrbc
    protocol: simple-it
    image: *vantage_image
    metrics_port: 6003

  - name: simpleit-bracha
    protocol: simple-it-bracha
    image: *vantage_image
    metrics_port: 6003

  - name: bluestreak
    protocol: starfish
    image: ghcr.io/iotaledger/starfish-node@sha256:3f7ee52dff606214e1dd979c31783f4bb4391405c2317c4b41b0728a89d04d88
    metrics_port: 1500
    protocol_flags: [--consensus, bluestreak]

  - name: sailfish-pp
    protocol: starfish
    image: ghcr.io/iotaledger/starfish-node@sha256:3f7ee52dff606214e1dd979c31783f4bb4391405c2317c4b41b0728a89d04d88
    metrics_port: 1500
    protocol_flags: [--consensus, sailfish-pp]
