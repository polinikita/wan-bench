name: n100-leader-relay-scaling
output: results/n100-leader-relay-scaling
committee_sizes: [100]
rates: [1000, 5000, 10000, 20000, 40000, 60000, 80000, 100000, 125000, 150000, 175000, 200000, 250000]
warmup_s: 30
window_s: 120
drop_tolerance_pct: 5
stop_on_drop: true
strict_through_rate: 10000
min_offered_throughput_pct: 50

base:
  region: eu-west-1
  profile: null
  az: eu-west-1a
  # One validator per 8-vCPU, 16-GiB instance; protocol traffic uses private IPs.
  instance_type: c5d.2xlarge
  key_name: wanbench-key
  ssh_key_path: ~/.ssh/id_ed25519_nikita_iota6
  ssh_user: ubuntu
  ssh_open_cidr: null
  spot: false
  disk_gb: 50
  use_instance_store: true
  keep_monitoring_on_down: false
  grafana_open_cidr: null
  deadman_minutes: 60

  # Build the exact checked-out Vantage commit on the control host, then serve
  # that immutable image to validators over the experiment's private network.
  image: vantage-node:n100-leader-relay-20260815
  image_source: build-on-control
  build_repo: ../vantage
  build_dockerfile: docker-bench/Dockerfile

  tx_size: 512
  tx_mode: random
  delta_ms: 200
  max_header_delay_ms: 100
  spam_initial_delay_ms: 10000
  spam_delay_per_node_ms: 200
  spam_lead_ms: 25000
  prometheus_scrape_interval_s: 5

  # f=33 Byzantine authors receive the same load share as every other author.
  # Each Byzantine author forms one batch per Delta, retains its local copy,
  # and sends the bytes only to the same 32=(f-1)-wide correct group. These
  # f=33 direct holders are exactly one below the f+1=34 PoA threshold; the
  # other Byzantine validators receive no copy. The group is held for five
  # batches (5*Delta=1s), then advances by f-1, covering every correct leader
  # and placing all faulty lanes at each selected leader.
  # A selected Byzantine consensus leader proposes its certified cut; the
  # measured optimistic relay burden is therefore placed on honest leaders.
  # Autobahn's selected Byzantine cars carry one digest, keeping one sub-PoA
  # tip active until later dissemination supplies another holder. Headers stay
  # visible and Byzantine authors never answer lane repair.
  data_lane_drop_staggered_senders: 33
  data_lane_drop_staggered_width: 99
  data_lane_drop_publisher_stride: 1
  data_lane_drop_staggered_stride: 1
  data_lane_drop_silent_repair: true
  data_lane_drop_headers: false
  leader_relay_attack: true

  wan:
    mode: netem
    rtt_csv: latency/aws-10region-rtt.csv
    jitter_ms: 0.0
    halve_rtt: true
    netem_limit_pkts: 100000

  fault:
    kind: none

variants:
  - name: autobahn-optimistic-a2a
    protocol: autobahn-optimistic
    metrics_port: 6003
    all_to_all: true

  - name: vantage
    protocol: vantage
    metrics_port: 6003
    echo_avail_claims: true
    vantage_compact_ids: true

  - name: simpleit-optrbc
    protocol: simple-it
    metrics_port: 6003
