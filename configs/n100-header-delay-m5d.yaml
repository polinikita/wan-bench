name: n100-header-delay-m5d
output: results/n100-header-delay-m5d
committee_sizes: [100]
# Two ends of the load range: a latency-only point and a saturation point.
rates: [100, 250000]
warmup_s: 30
window_s: 120
drop_tolerance_pct: 5
# Every point must be attempted: this is a four-point matrix, not a ladder to a knee.
stop_on_drop: false
strict_through_rate: 10000
min_offered_throughput_pct: 95

base:
  region: eu-west-1
  profile: null
  az: eu-west-1a
  # 8 vCPUs, 32 GiB memory, and one 300 GB local NVMe SSD. The paper campaign used
  # c5d.2xlarge, so these points are internally comparable but not to that campaign.
  instance_type: m5d.2xlarge
  key_name: wanbench-key
  ssh_key_path: ~/.ssh/id_ed25519_nikita_iota6
  ssh_user: ubuntu
  ssh_open_cidr: null
  spot: false
  disk_gb: 50
  use_instance_store: true
  keep_monitoring_on_down: false
  grafana_open_cidr: null
  deadman_minutes: 60

  tx_size: 512
  tx_mode: random
  delta_ms: 200
  spam_initial_delay_ms: 10000
  spam_delay_per_node_ms: 200
  spam_lead_ms: 25000
  prometheus_scrape_interval_s: 5

  wan:
    mode: netem
    rtt_csv: latency/aws-10region-rtt.csv
    jitter_ms: 0.0
    halve_rtt: true
    netem_limit_pkts: 100000

  fault:
    kind: none

# Both variants run on one fleet, so the header-delay comparison is paired on
# identical hardware and placement.
variants:
  - name: header-100ms
    protocol: vantage
    # Vantage commit 13b4c20f0869c0df52133f6ffa5ca3632ab42e94.
    image: &vantage_image ghcr.io/polinikita/vantage-node@sha256:e4bc05f09ee916c4fd77fdc8cb6fec00009e67bcdab50529667f829152db756c
    metrics_port: 6003
    echo_avail_claims: true
    vantage_compact_ids: true
    max_header_delay_ms: 100

  - name: header-50ms
    protocol: vantage
    image: *vantage_image
    metrics_port: 6003
    echo_avail_claims: true
    vantage_compact_ids: true
    max_header_delay_ms: 50
