name: paper-n100-autobahn-optimistic-saturation
output: results/paper-n100-autobahn-optimistic-saturation
committee_sizes: [100]
# The 20260811 paper campaign accepted 100 and 10k and then failed the 150k
# progress barrier, so the Autobahn optimistic all-to-all curve above 10k is
# unmeasured. Resume the ladder at 150k on the current image and stop at
# saturation.
rates: [150000, 200000, 225000, 250000, 275000, 300000]
warmup_s: 30
window_s: 120
drop_tolerance_pct: 5
stop_on_drop: true
strict_through_rate: 10000
min_offered_throughput_pct: 95

base:
  region: eu-west-1
  profile: null
  az: eu-west-1a
  # 8 vCPUs, 16 GiB memory, and one 200 GB local NVMe SSD.
  instance_type: c5d.2xlarge
  key_name: wanbench-key
  ssh_key_path: ~/.ssh/id_ed25519_nikita_iota6
  ssh_user: ubuntu
  ssh_open_cidr: null
  spot: false
  disk_gb: 50
  use_instance_store: true
  keep_monitoring_on_down: false
  grafana_open_cidr: null
  deadman_minutes: 60

  tx_size: 512
  tx_mode: random
  delta_ms: 200
  max_header_delay_ms: 100
  spam_initial_delay_ms: 10000
  spam_delay_per_node_ms: 200
  spam_lead_ms: 25000
  prometheus_scrape_interval_s: 5

  wan:
    mode: netem
    rtt_csv: latency/aws-10region-rtt.csv
    jitter_ms: 0.0
    halve_rtt: true
    netem_limit_pkts: 100000

  fault:
    kind: none

variants:
  - name: autobahn-optimistic-a2a
    protocol: autobahn-optimistic
    # Vantage main 57a0f1140b932d6e14a6311b3336bae333649008: the 64 MiB
    # length-delimited frame limit plus the primary log-level fix.
    image: ghcr.io/polinikita/vantage-node@sha256:fb256ad9af5e5fc18abae63979c30a53f1236fb5b00fa7cad536cc3e911ffe86
    metrics_port: 6003
    all_to_all: true
