name: n100-vantage-claimidx-c5d
output: results/n100-vantage-claimidx-c5d
committee_sizes: [100]
# A latency-only reference point plus a tight ladder across the saturation knee. The
# earlier campaign put the knee between 225k and 270k, where single points scatter, so
# the three high rates are one step apart rather than spread.
rates: [225000, 240000, 250000]
warmup_s: 30
window_s: 120
drop_tolerance_pct: 5
# Every rate is attempted: the shape of the fall-off past the knee is the point, so an
# early stop would discard exactly the data being sought.
stop_on_drop: false
# All points exploratory. A strict low-rate point that fails twice raises and takes the
# rest of the ladder with it, which is how an earlier campaign lost a cell.
strict_through_rate: null
min_offered_throughput_pct: 95

base:
  region: eu-west-1
  profile: null
  az: eu-west-1a
  # 8 vCPUs, 16 GiB memory, one 200 GB local NVMe SSD.
  instance_type: c5d.2xlarge
  key_name: wanbench-key
  ssh_key_path: ~/.ssh/id_ed25519_nikita_iota6
  ssh_user: ubuntu
  ssh_open_cidr: null
  spot: false
  disk_gb: 50
  use_instance_store: true
  keep_monitoring_on_down: false
  grafana_open_cidr: null
  deadman_minutes: 60

  tx_size: 512
  tx_mode: random
  delta_ms: 200
  # The inherited operating point. Autobahn's own AWS task defaults to 100 ms, and
  # halving it costs tail latency, memory, and per-transaction wire cost at n=100.
  max_header_delay_ms: 100
  spam_initial_delay_ms: 10000
  spam_delay_per_node_ms: 200
  spam_lead_ms: 25000
  prometheus_scrape_interval_s: 5

  wan:
    mode: netem
    rtt_csv: latency/aws-10region-rtt.csv
    jitter_ms: 0.0
    halve_rtt: true
    netem_limit_pkts: 100000

  fault:
    kind: none

variants:
  - name: vantage
    protocol: vantage
    # Vantage 6671e4ee6e86e5a9c33c6375b60229fb3af2460b. Channel authentication is on by
    # default from this commit, so these points carry the per-frame pairwise MAC and are
    # not directly comparable to earlier unauthenticated figures at the same rates.
    image: ghcr.io/polinikita/vantage-node:175c0ba5f6ec203dad2cae877e860f3eb7a2ffc7
    metrics_port: 6003
    echo_avail_claims: true
    vantage_compact_ids: true
