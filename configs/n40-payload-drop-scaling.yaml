name: n40-leader-relay-scaling
output: results/n40-leader-relay-scaling
committee_sizes: [40]
sweep_field: adversarial_rate
rates: [0, 52000, 104000, 156000, 208000, 260000, 312000]
warmup_s: 30
window_s: 120
drop_tolerance_pct: 5
stop_on_drop: false
strict_through_rate: 104000
min_offered_throughput_pct: null

base:
  region: eu-west-1
  profile: null
  az: eu-west-1a
  instance_type: c5d.2xlarge
  key_name: wanbench-key
  ssh_key_path: ~/.ssh/id_ed25519_nikita_iota6
  ssh_user: ubuntu
  ssh_open_cidr: null
  spot: false
  disk_gb: 50
  use_instance_store: true
  keep_monitoring_on_down: false
  grafana_open_cidr: null
  deadman_minutes: 60

  image: ghcr.io/polinikita/vantage-node@sha256:1403c71d8dc23c18d0dfbf982743b4aef6715707a1bbb3bee83749dc0611a0ad
  image_source: registry

  # Counted validity demand remains fixed while only Byzantine lane payload
  # scales. 108k divides exactly over the 27 correct validators (4k each);
  # every 52k background step adds 4k tx/s to each of the 13 faulty authors.
  rate: 108000
  correct_load_only: true
  tx_size: 512
  tx_mode: random
  delta_ms: 200
  max_header_delay_ms: 100
  spam_initial_delay_ms: 10000
  spam_delay_per_node_ms: 200
  spam_lead_ms: 25000
  prometheus_scrape_interval_s: 5

  # f=13 Byzantine lane authors narrowcast each heavy worker batch to a
  # different 26-node subset, publish lane headers normally, and never answer
  # repair. Publisher stride 3 avoids consecutive Byzantine leaders; omission
  # stride 13 makes every correct leader hold 8-9 faulty tips and relay
  # them to the 4-5 subsets that are missing them.
  data_lane_drop_staggered_senders: 13
  data_lane_drop_staggered_width: 13
  data_lane_drop_publisher_stride: 3
  data_lane_drop_staggered_stride: 13
  data_lane_drop_silent_repair: true
  data_lane_drop_headers: false

  wan:
    mode: netem
    rtt_csv: latency/aws-10region-rtt.csv
    jitter_ms: 0.0
    halve_rtt: true
    netem_limit_pkts: 100000

  fault:
    kind: none

variants:
  - name: autobahn-optimistic-a2a
    protocol: autobahn-optimistic
    metrics_port: 6003
    all_to_all: true

  - name: vantage
    protocol: vantage
    metrics_port: 6003
    echo_avail_claims: true
    vantage_compact_ids: true

  - name: simpleit-optrbc
    protocol: simple-it
    metrics_port: 6003
