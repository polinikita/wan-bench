name: paper-n100-bluestreak-knee
output: results/paper-n100-bluestreak-knee
# Targeted knee window for Bluestreak on the uniform c5d.2xlarge fleet with
# the payload-compacted starfish-node image (PR #136).  The recorded m5d-gc
# campaign put the knee at 250k accepted / 275k overloaded with a 5.4 GB RSS
# peak, so the window is measured directly instead of the full ladder.  Two
# repetitions; the paper reports the median per cell.
committee_sizes: [100]
rates: [225000, 250000, 275000]
warmup_s: 30
window_s: 120
drop_tolerance_pct: 5
stop_on_drop: true
point_attempts: 1
strict_through_rate: null
min_offered_throughput_pct: 95

base:
  region: eu-west-1
  profile: null
  az: eu-west-1a
  # 8 vCPUs, 32 GiB memory, and one 300 GB local NVMe SSD (matches the recorded m5d-gc campaign).
  instance_type: m5d.2xlarge
  key_name: wanbench-key
  ssh_key_path: ~/.ssh/id_ed25519_nikita_iota6
  ssh_user: ubuntu
  ssh_open_cidr: null
  spot: false
  disk_gb: 50
  use_instance_store: true
  keep_monitoring_on_down: false
  grafana_open_cidr: null
  deadman_minutes: 60

  tx_size: 512
  tx_mode: random
  delta_ms: 200
  max_header_delay_ms: 100
  spam_initial_delay_ms: 10000
  spam_delay_per_node_ms: 200
  spam_lead_ms: 25000
  prometheus_scrape_interval_s: 5

  wan:
    mode: netem
    rtt_csv: latency/aws-10region-rtt.csv
    jitter_ms: 0.0
    halve_rtt: true
    netem_limit_pkts: 100000

  fault:
    kind: none

variants:
  - name: bluestreak
    protocol: starfish
    # Starfish main after PR #136 (compact sequenced payloads).
    image: ghcr.io/iotaledger/starfish-node@sha256:3f7ee52dff606214e1dd979c31783f4bb4391405c2317c4b41b0728a89d04d88
    metrics_port: 1500
    protocol_flags: [--consensus, bluestreak]
