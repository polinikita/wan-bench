# Pre-campaign gate: does the crash-free wedge survive on real WAN?
#
# The n=50 committee point is the cheapest reproducer of the Autobahn wedge
# (a2a stalled 4 of 50 validators, seamless all 50) and therefore the cheapest
# proof that it is gone. It deliberately mirrors paper-committee-scaling.yaml
# point-for-point so a pass here predicts that campaign's n=50 cell.
#
# The image is the same immutable GHCR digest the paper campaigns pin, so a
# pass here is a citable record rather than a throwaway.
name: gate-n50-autobahn
output: results/gate-n50-autobahn
committee_sizes: [50]
rates: [100]
warmup_s: 30
window_s: 120
drop_tolerance_pct: 5
stop_on_drop: true
# One retry, because a flaky fleet here would read as "the fix failed".
point_attempts: 2
terminal_point_attempts: 1
min_offered_throughput_pct: 95

base:
  region: eu-west-1
  profile: null
  az: eu-west-1a
  instance_type: c5d.2xlarge
  key_name: wanbench-key
  ssh_key_path: ~/.ssh/id_ed25519_nikita_iota6
  ssh_user: ubuntu
  ssh_open_cidr: null
  spot: false
  disk_gb: 50
  use_instance_store: true
  keep_monitoring_on_down: false
  grafana_open_cidr: null
  deadman_minutes: 60

  tx_size: 512
  tx_mode: random
  delta_ms: 200
  max_header_delay_ms: 100
  spam_initial_delay_ms: 10000
  spam_delay_per_node_ms: 200
  spam_lead_ms: 25000
  prometheus_scrape_interval_s: 5

  # Vantage commit fb4a007035835dbff2bdf593269ef375affec6f2.
  image: ghcr.io/polinikita/vantage-node@sha256:d8e573c99df492cbddb7280b2e0e6c5aefa115ba2523b1db906815261fac2289
  image_source: registry

  wan:
    mode: netem
    rtt_csv: latency/aws-10region-rtt.csv
    jitter_ms: 0.0
    halve_rtt: true
    netem_limit_pkts: 100000

  fault:
    kind: none

variants:
  - name: autobahn-optimistic-a2a
    protocol: autobahn-optimistic
    metrics_port: 6003
    all_to_all: true

  - name: autobahn-seamless
    protocol: autobahn-seamless
    metrics_port: 6003
