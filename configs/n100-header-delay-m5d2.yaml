name: n100-header-delay-m5d2
output: results/n100-header-delay-m5d2
committee_sizes: [100]
# Latency-only load. The catch-up cost this probes scales with lane count and block
# density, not with transaction volume, and the AWS trap appeared at exactly this rate.
rates: [100]
warmup_s: 30
window_s: 120
drop_tolerance_pct: 5
stop_on_drop: false
# Every cell must be attempted independently. A strict low-rate point that fails twice
# raises and takes the rest of its variant's ladder with it, which is how the earlier
# m5d campaign lost a cell.
strict_through_rate: null
min_offered_throughput_pct: 95

base:
  region: eu-west-1
  profile: null
  az: eu-west-1a
  # 8 vCPUs, 32 GiB memory, one 300 GB local NVMe SSD.
  instance_type: m5d.2xlarge
  key_name: wanbench-key
  ssh_key_path: ~/.ssh/id_ed25519_nikita_iota6
  ssh_user: ubuntu
  ssh_open_cidr: null
  spot: false
  disk_gb: 50
  use_instance_store: true
  keep_monitoring_on_down: false
  grafana_open_cidr: null
  deadman_minutes: 60

  tx_size: 512
  tx_mode: random
  delta_ms: 200
  spam_initial_delay_ms: 10000
  spam_delay_per_node_ms: 200
  spam_lead_ms: 25000
  prometheus_scrape_interval_s: 5

  wan:
    mode: netem
    rtt_csv: latency/aws-10region-rtt.csv
    jitter_ms: 0.0
    halve_rtt: true
    netem_limit_pkts: 100000

  fault:
    kind: none

# Both header settings share one fleet, so the comparison is paired on identical
# hardware and placement.
variants:
  - name: header-100ms
    protocol: vantage
    # Vantage bd5b7caf58092f1370b2a98c10de09e1fb0cb8c6: concurrent disjoint sequence
    # fetch, so state-sync passes close a gap in round trips rather than one chunk each.
    image: &vantage_image ghcr.io/polinikita/vantage-node:bd5b7caf58092f1370b2a98c10de09e1fb0cb8c6
    metrics_port: 6003
    echo_avail_claims: true
    vantage_compact_ids: true
    max_header_delay_ms: 100

  - name: header-50ms
    protocol: vantage
    image: *vantage_image
    metrics_port: 6003
    echo_avail_claims: true
    vantage_compact_ids: true
    max_header_delay_ms: 50
