[project]
name = "wan-bench"
version = "0.1.0"
description = "AWS orchestration for reproducible BFT protocol benchmarks"
requires-python = ">=3.10"
dependencies = ["boto3>=1.40.9", "PyYAML>=6.0"]

[project.scripts]
wanbench = "wanbench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["wanbench"]
