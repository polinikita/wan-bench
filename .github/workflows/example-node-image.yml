# TEMPLATE (belongs in each PROTOCOL codebase, not here): build the node docker
# image and push it to GHCR on every push, tagged by commit SHA. wan-bench pulls
# `ghcr.io/<org>/<protocol>-node:<sha>`. Copy into vantage/starfish and adjust the
# Dockerfile path + image name. Reproduced here as documentation of the contract.
name: node-image
on:
  push:
    branches: [main]
jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker-bench/Dockerfile   # or the codebase's node Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/vantage-node:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/vantage-node:latest
